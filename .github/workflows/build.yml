name: Build Pet APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p app_src
          tar xzf project.tar.gz -C app_src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $SDKM"
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: app_src
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app_src/app/build/outputs/apk/debug/app-debug.apk pet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pet-apk
          path: pet.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pet build ${{ github.run_number }}
          files: pet.apk
